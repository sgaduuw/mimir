name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same branch / PR when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check mimir/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      # Pydantic-settings requires SECRET_KEY (min_length=16). CI uses
      # a dummy; production deployments override via .env / systemd
      # EnvironmentFile / compose env.
      SECRET_KEY: ci-dummy-key-not-for-real-use-12345678
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Migrate DB
        # Creates a fresh SQLite at <repo>/mimir.db. bootstrap_inboxes
        # then seeds the env-defined inboxes on first create_app(),
        # so the route smoke tests find at least one inbox.
        run: poetry run alembic upgrade head

      - name: Pytest
        run: poetry run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    # Skip on PRs from forks — no need to verify docker on every
    # untrusted contribution, and our build is single-arch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: mimir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

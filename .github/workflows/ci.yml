name: ci

on:
  push:
    branches: [develop, main, "release/*", "hotfix/*"]
    tags: ['v*']
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

# Cancel in-flight runs on the same branch / PR when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions for every job in this workflow.
# GitHub's default grants `contents: write`, `issues: write`,
# `packages: write`, etc.; the lint + test jobs only need to read the
# repo, so the workflow-wide default narrows the blast radius if a
# step is ever compromised. The docker job opts back in to
# `packages: write` for GHCR push via its own `permissions:` block.
# Clears CodeQL `actions/missing-workflow-permissions` (alerts #2, #10).
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than mutable major-version
# tags (`@v6`, `@v7`, ...). The SHA is what GitHub actually checks
# out; a tag can be moved by the action publisher and the next run
# silently picks up the new ref. Pinning closes that supply-chain
# window. The trailing comment carries the semver tag the SHA
# matches, so Dependabot / Renovate can bump these in lockstep.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check mimir/ tests/

      - name: Ruff format check
        run: uv run ruff format --check mimir/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      # Pydantic-settings requires SECRET_KEY (min_length=16). CI uses
      # a dummy; production deployments override via .env / systemd
      # EnvironmentFile / compose env.
      SECRET_KEY: ci-dummy-key-not-for-real-use-12345678
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pytest
        # The conftest's session-scoped `_migrate_db` fixture runs
        # `alembic upgrade head` against the test process's temp DB
        # (in tempfile.mkdtemp, not the repo root). A separate
        # migrate step here is redundant, and post-2.0.0 it'd also
        # fail because non-broker processes open `query_only=1`.
        run: uv run pytest -v

  test-ft:
    runs-on: ubuntu-latest
    env:
      # Same dummy as the `test` job; production overrides via .env.
      SECRET_KEY: ci-dummy-key-not-for-real-use-12345678
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python (free-threaded 3.14t)
        # `python-version: '3.14t'` is the setup-python spec for the
        # free-threaded build (PEP 703 / PEP 779). If a future
        # setup-python release drops support for this spec, fall back
        # to installing python-build-standalone directly via curl from
        # https://github.com/astral-sh/python-build-standalone/releases
        # (same source the Dockerfile uses; pin via release date).
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14t'

      - name: Install uv
        # `python-version: '3.14t'` here is the load-bearing bit for the
        # free-threaded job: setup-uv exports UV_PYTHON so that uv sync /
        # uv run pick the freethreaded interpreter setup-python just
        # provisioned, rather than uv's own default (which is a regular
        # GIL-enabled 3.14 build and would silently re-enable the GIL).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.14t'

      - name: Confirm uv selected the free-threaded interpreter
        # Fail-fast before paying for `uv sync`: catches the uv-vs-
        # setup-python disagreement (regression class fixed by the
        # python-version pin on setup-uv above) in seconds rather than
        # after wheel install. --no-project --no-sync makes uv resolve
        # the configured Python without touching project dependencies.
        run: uv run --no-project --no-sync python -c "import sys; assert sys._is_gil_enabled() is False, 'expected free-threaded build'"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, test-ft]
    # Skip on PRs from forks, no creds, and our build is single-arch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        # PRs don't get push creds (forks would fail anyway). Pushes
        # to main and version tags authenticate with the workflow's
        # GITHUB_TOKEN, no extra secret needed.
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          # PRs build for verification only; pushes publish to ghcr.io.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

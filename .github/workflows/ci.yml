name: ci

on:
  push:
    branches: [develop, main, "release/*", "hotfix/*"]
    tags: ['v*']
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

# Cancel in-flight runs on the same branch / PR when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions for every job in this workflow.
# GitHub's default grants `contents: write`, `issues: write`,
# `packages: write`, etc.; the lint + test jobs only need to read the
# repo, so the workflow-wide default narrows the blast radius if a
# step is ever compromised. The docker job opts back in to
# `packages: write` for GHCR push via its own `permissions:` block.
# Clears CodeQL `actions/missing-workflow-permissions` (alerts #2, #10).
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than mutable major-version
# tags (`@v6`, `@v7`, ...). The SHA is what GitHub actually checks
# out; a tag can be moved by the action publisher and the next run
# silently picks up the new ref. Pinning closes that supply-chain
# window. The trailing comment carries the semver tag the SHA
# matches, so Dependabot / Renovate can bump these in lockstep.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check mimir/ tests/

      - name: Ruff format check
        run: poetry run ruff format --check mimir/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      # Pydantic-settings requires SECRET_KEY (min_length=16). CI uses
      # a dummy; production deployments override via .env / systemd
      # EnvironmentFile / compose env.
      SECRET_KEY: ci-dummy-key-not-for-real-use-12345678
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Pytest
        # The conftest's session-scoped `_migrate_db` fixture runs
        # `alembic upgrade head` against the test process's temp DB
        # (in tempfile.mkdtemp, not the repo root). A separate
        # migrate step here is redundant, and post-2.0.0 it'd also
        # fail because non-broker processes open `query_only=1`.
        run: poetry run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip on PRs from forks, no creds, and our build is single-arch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        # PRs don't get push creds (forks would fail anyway). Pushes
        # to main and version tags authenticate with the workflow's
        # GITHUB_TOKEN, no extra secret needed.
        if: github.event_name == 'push'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          # PRs build for verification only; pushes publish to ghcr.io.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

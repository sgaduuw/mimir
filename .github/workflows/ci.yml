name: ci

on:
  push:
    branches: [develop, main, "release/*", "hotfix/*"]
    tags: ['v*']
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

# Cancel in-flight runs on the same branch / PR when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check mimir/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      # Pydantic-settings requires SECRET_KEY (min_length=16). CI uses
      # a dummy; production deployments override via .env / systemd
      # EnvironmentFile / compose env.
      SECRET_KEY: ci-dummy-key-not-for-real-use-12345678
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Cache Poetry venv
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: poetry-${{ runner.os }}-py3.14-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Migrate DB
        # Creates a fresh SQLite at <repo>/mimir.db. bootstrap_inboxes
        # then seeds the env-defined inboxes on first create_app(),
        # so the route smoke tests find at least one inbox.
        run: poetry run alembic upgrade head

      - name: Pytest
        run: poetry run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip on PRs from forks — no creds, and our build is single-arch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # PRs don't get push creds (forks would fail anyway). Pushes
        # to main and version tags authenticate with the workflow's
        # GITHUB_TOKEN — no extra secret needed.
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # PRs build for verification only; pushes publish to ghcr.io.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

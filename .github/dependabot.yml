version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  # Reads pyproject.toml + uv.lock together (uv ecosystem updates both).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  # Tracks the debian:trixie-slim base image referenced via FROM in the
  # Dockerfile. The Astral python-build-standalone tarball pulled into
  # the python-3.14t stage is ARG-pinned (PBS_RELEASE / PYTHON_VERSION)
  # and is not visible to Dependabot's docker scanner; PBS bumps stay
  # manual until a custom updater becomes worth wiring up.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

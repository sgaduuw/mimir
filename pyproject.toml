[project]
name = "mimir"
version = "3.8.0"
description = "toy project for reading lkml"
authors = [{name = "Eelco Wesemann", email = "6771014+sgaduuw@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "flask (>=3.0.0,<4.0.0)",
    "sqlalchemy>=2.0.52,<3.0.0",
    "alembic>=1.19.1,<2.0.0",
    "dulwich>=1.2.12,<2.0.0",
    "pydantic (>=2.5.0,<3.0.0)",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pygments (>=2.17.0,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
]

[project.scripts]
# Standalone CLI entry point (#221). Same backing as
# `flask --app mimir <cmd>` via `FlaskGroup`; both stay supported.
mimir = "mimir.cli:mimir"

[dependency-groups]
dev = [
    "ruff>=0.16.3,<0.17",
    "pytest>=9.1.1,<10",
    "pillow>=12.3.0,<13",
    "pytest-cov>=7.1.0,<8",
    "freezegun>=1.5.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimir"]

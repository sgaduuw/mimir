[tool.poetry]
name = "mimir"
version = "1.2.0"
description = "toy project for reading lkml"
authors = ["Eelco Wesemann <6771014+sgaduuw@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
flask = "^3.0.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
dulwich = "^0.21.7"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pygments = "^2.17.0"
gunicorn = "^26.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.7"
pytest = "^9.0.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

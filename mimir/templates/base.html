<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mimir{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.amber.min.css"
        integrity="sha384-BiacLKDCyG54e35iUPYB3xZg4mZ2my6tLgF44LKpomzgxexC+sAL7aL7f2mxTh7J"
        crossorigin="anonymous">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
          crossorigin="anonymous" defer></script>
</head>
<body>
  <main class="container">
    <nav>
      <ul>
        <li><a href="{{ url_for('web.index') }}"><strong>mimir</strong></a></li>
        {% if current_inbox %}
        <li><a href="/{{ current_inbox }}/">{{ current_inbox }}</a></li>
        <li><a href="/{{ current_inbox }}/today">today</a></li>
        <li><a href="/{{ current_inbox }}/yesterday">yesterday</a></li>
        {% endif %}
      </ul>
      <ul>
        {% if inboxes|length > 1 and not current_inbox %}
        <li><small>{{ inboxes|length }} inboxes</small></li>
        {% elif current_inbox %}
        <li><small>archive</small></li>
        {% endif %}
      </ul>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

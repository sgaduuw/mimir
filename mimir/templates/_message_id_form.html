{# A plain GET lookup with escaped prefill, also usable without JavaScript. #}
{% from "_search_field.html" import search_field %}
{% macro message_id_form(value="") -%}
<form class="message-id-form" action="{{ url_for('web.message_id_lookup_form') }}" method="get">
  {% call search_field('message-id-input', 'Open a message by its Message-ID', 'Open') %}
  <input id="message-id-input" type="text" name="id" value="{{ value }}" maxlength="998" required autocomplete="off" spellcheck="false" placeholder="20260101.1234-1-name@example.org">
  {% endcall %}
</form>
{%- endmacro %}

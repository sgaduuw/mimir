# `docker compose up` brings mimir up with the canonical bind-mount
# layout. Adjust paths / env to taste.
#
# SECRET_KEY is read from your shell or a sibling `.env` file:
#   echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" > .env
#
# 2.0.0 architecture: three containers.
#   - mimir-broker   : the sole SQLite writer process. Owns the
#                      `/data/.migrated` / `.bootstrapped` /
#                      `.broker_initial_analyze` sentinels on startup;
#                      serves cache + admin RPCs on a UNIX socket;
#                      runs internal periodic cache purges.
#   - mimir          : the web tier. Read-only at the SQLite level
#                      (`MIMIR_DEPLOY=true` ⇒ `query_only=1`). Routes
#                      cache writes through the broker socket.
#   - mimir-tasks    : the scheduler. Also read-only at the SQLite
#                      level; its job is firing RPCs at the broker
#                      on a timer.

services:
  mimir-broker:
    build: .
    image: mimir:latest
    command: ["mimir", "broker", "--socket", "/data/.broker.sock"]
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      # Broker role: this is the sole writer. `query_only` stays OFF
      # on its connections. The broker process does NOT set
      # BROKER_SOCKET_PATH on itself (no self-RPC; `_should_dispatch_to_broker`
      # checks `mimir_is_broker` and short-circuits).
      MIMIR_IS_BROKER: "true"
      MIMIR_DEPLOY: "true"
      # Route SQLite's VACUUM temp file (a full copy of the live DB)
      # to /data/db/ where the 92T pool lives, instead of the
      # container's overlayfs /tmp (bounded by the storage pool's
      # remaining headroom). Without this, VACUUM on a multi-GB DB
      # fails with SQLITE_FULL once temp space runs out. Set on the
      # broker only since the broker is the sole VACUUM caller.
      SQLITE_TMPDIR: /data/db
      # Keep the GIL disabled under the 3.14t free-threading build.
      # CPython auto-re-enables the GIL when any C extension without
      # a Py_GIL_DISABLED declaration is imported (SQLAlchemy's
      # cyextension.collections is one such module). Setting PYTHON_GIL=0
      # suppresses the re-enable; warnings still fire at import but the
      # runtime stays GIL-free. Broker only: it is the multi-thread
      # process (cache + long + 4 warm workers) where free-threading
      # actually pays off. mimir-app is gunicorn sync workers (one
      # thread each); mimir-tasks is the scheduler shelling out RPCs.
      PYTHON_GIL: "0"
      # Replace glibc malloc with mimalloc on the broker via LD_PRELOAD.
      # Broker only: it allocates burstly during warm cycles (cache fan-out
      # across ~50+ inboxes) and we want the pages returned to the kernel
      # promptly once a cycle ends. glibc malloc holds 128 per-thread arenas
      # under the default `arena_max = 8 * nproc` (16 cores * 8 = 128 here),
      # which fragments badly under free-threaded Python's many-threads
      # contention pattern and returns pages to the kernel opportunistically
      # at best. mimalloc's segment-based design uses `madvise(MADV_DONTNEED)`
      # proactively under MIMALLOC_PURGE_DELAY (ms). 200ms is more eager
      # than the default 1000ms without thrashing mid-cycle.
      #
      # CPython 3.14t already uses a vendored mimalloc internally for
      # Python object allocation; this LD_PRELOAD swaps glibc malloc for
      # C-level allocations too (dulwich's C bits, OpenSSL, libuv, etc.).
      # Net: one allocator across the broker's whole address space.
      #
      # mimir-app and mimir-tasks stay on glibc malloc; neither hits the
      # broker's warm-cycle allocation pattern. Issue #447, spec at
      # _claude/specs/2026-06-08-broker-mimalloc-allocator-design.md.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libmimalloc.so.3
      MIMALLOC_PURGE_DELAY: "200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mimir", "broker-ping", "--socket", "/data/.broker.sock"]
      interval: 10s
      timeout: 2s
      retries: 3
      # Generous start_period: a fresh deploy runs alembic upgrade +
      # bootstrap_inboxes + bounded ANALYZE on first startup before
      # accepting RPCs. Subsequent restarts skip via sentinel.
      start_period: 60s

  mimir:
    build: .
    image: mimir:latest
    ports:
      - "5000:5000"
    volumes:
      # Single state volume. Layout (created at build time):
      #   ./data/db/       , SQLite DB + WAL files
      #   ./data/Inboxes/  , per-inbox public-inbox git mirrors
      # Pre-flight: `mkdir -p data/db data/Inboxes && chown -R 1001:1001 data`.
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      WORKERS: "2"
      # Wire up ProxyFix so request.remote_addr / .scheme / .host
      # reflect the real client through Caddy (or whatever reverse
      # proxy fronts the container). Set to the number of trusted
      # proxy hops in front of mimir:
      #   "1"  Caddy (or nginx) directly in front of mimir.
      #   "2"  Tailscale Funnel + Caddy (the ratatoskr.run shape).
      # Bump only if you stack more proxies. Leave unset if you
      # publish port 5000 directly, anyone could otherwise spoof
      # these values via a forged X-Forwarded-For. HSTS and the
      # absolute-URL emission (sitemap, og:url, JSON-LD) depend on
      # the right count being set.
      TRUSTED_PROXY_HOPS: "2"
      # `MIMIR_DEPLOY=true` opens every SQLite connection with
      # `PRAGMA query_only=1` (web tier is read-only post-2.0.0;
      # writes go through the broker) and enables the FLASK_DEBUG
      # refusal guard. Leave default `/data/.broker.sock` for
      # BROKER_SOCKET_PATH unless you've moved the socket.
      MIMIR_DEPLOY: "true"
      # Optional:
      # SITE_NAME: lkml-mirror
      # SECURITY_CONTACT: mailto:security@example.com
      # SECURITY_POLICY_URL: https://example.com/security
    restart: unless-stopped
    healthcheck:
      # Probe via python (guaranteed present, it's the app's runtime)
      # rather than wget (not in the python:3.x base image).
      # urlopen raises on non-2xx or network failure, so the exit code
      # mirrors `wget --tries=1 --spider`.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Gate web start on the broker's healthcheck so gunicorn doesn't
    # serve requests against an un-migrated schema or empty inboxes
    # table on a fresh /data volume. The broker self-bootstraps
    # (alembic, bootstrap_inboxes, post-migrate ANALYZE) before
    # flipping its own healthcheck green.
    depends_on:
      mimir-broker:
        condition: service_healthy

  # Scheduled-tasks sidecar: pre-flight warm, periodic update (sync +
  # ingest), update-mainline, analyze, vacuum, warm-cache. Replaces
  # cron / systemd timers. Shares the same /data volume; no port
  # exposure. See deploy/scheduler.sh for the loop body and the
  # env-overridable cadence knobs (WARM_CACHE_EVERY, UPDATE_EVERY,
  # UPDATE_MAINLINE_EVERY, ANALYZE_EVERY, VACUUM_EVERY, all in seconds).
  #
  # 2.0.0: this container does no direct SQLite writes. Every
  # scheduled task dispatches an RPC at the broker; the broker
  # serialises all writes through its single-writer process.
  mimir-tasks:
    build: .
    image: mimir:latest
    command: ["/app/scheduler.sh"]
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      # Read-only at the SQLite level; all writes go through the
      # broker. `MIMIR_DEPLOY=true` triggers `PRAGMA query_only=1`
      # on every connection and enables the FLASK_DEBUG refusal
      # guard. Leave default `/data/.broker.sock` for
      # BROKER_SOCKET_PATH unless you've moved the socket.
      MIMIR_DEPLOY: "true"
      # Silences the RuntimeWarning that fires on every Flask CLI
      # invocation when SQLAlchemy's cyextension imports re-enable
      # the GIL (see the broker block above for the full rationale).
      # tasks is the scheduler shelling out one-shot RPC dispatchers
      # in a loop, so each `mimir <cmd>` subprocess re-imports and
      # re-fires the warning; free-threading itself buys nothing
      # here. This is purely log hygiene.
      PYTHON_GIL: "0"
      # Match the web container's INBOXES / SITE_NAME / etc. so the
      # CLI commands see the same Settings.
      # SITE_NAME: lkml-mirror
      # INBOXES: '{"linux-fsdevel": {...}}'
      #
      # Default sidecar output is terse: warm-cache emits one summary
      # line per tick, update stays silent on no-op ticks. Uncomment
      # to dial the loop verbose; "-vv" adds per-message ingest detail.
      # For an ad-hoc verbose run without restarting:
      #   podman exec mimir-tasks flask --app mimir warm-cache -v
      # SCHEDULER_VERBOSE: "-v"
    restart: unless-stopped
    healthcheck:
      # The broker owns `.migrated`. Tasks healthcheck just checks
      # that the broker has finished bootstrapping (a proxy for "the
      # tasks loop has something to talk to").
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s
    depends_on:
      mimir-broker:
        condition: service_healthy

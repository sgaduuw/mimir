# `docker compose up` brings mimir up with the canonical bind-mount
# layout. Adjust paths / env to taste.
#
# SECRET_KEY is read from your shell or a sibling `.env` file:
#   echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" > .env

services:
  mimir:
    build: .
    image: mimir:latest
    ports:
      - "5000:5000"
    volumes:
      # Single state volume. Layout (created at build time):
      #   ./data/db/       , SQLite DB + WAL files
      #   ./data/Inboxes/  , per-inbox public-inbox git mirrors
      # Pre-flight: `mkdir -p data/db data/Inboxes && chown -R 1001:1001 data`.
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      WORKERS: "2"
      # Wire up ProxyFix so request.remote_addr / .scheme / .host
      # reflect the real client through Caddy (or whatever reverse
      # proxy fronts the container). Set to the number of trusted
      # proxy hops in front of mimir:
      #   "1"  Caddy (or nginx) directly in front of mimir.
      #   "2"  Tailscale Funnel + Caddy (the ratatoskr.run shape).
      # Bump only if you stack more proxies. Leave unset if you
      # publish port 5000 directly, anyone could otherwise spoof
      # these values via a forged X-Forwarded-For. HSTS and the
      # absolute-URL emission (sitemap, og:url, JSON-LD) depend on
      # the right count being set.
      TRUSTED_PROXY_HOPS: "2"
      # Write-broker integration (opt-in, off by default). Uncomment
      # both lines AND the `mimir-broker` service block below to
      # route cache.set / delete / delete_for_inbox / purge through
      # the broker sidecar's UNIX socket. With MIMIR_ROLE=web set,
      # PRAGMA query_only=1 is also issued on every connection as
      # belt-and-braces. Default deploy keeps these unset, web
      # writes direct to SQLite, matching pre-1.32.0 behaviour.
      # MIMIR_ROLE: "web"
      # BROKER_SOCKET_PATH: "/data/.broker.sock"
      # Optional:
      # SITE_NAME: lkml-mirror
      # SECURITY_CONTACT: mailto:security@example.com
      # SECURITY_POLICY_URL: https://example.com/security
      #
      # Maintenance toggle. Set to "true" to quiesce all DB writes
      # from this container (cache.set / delete / purge become no-ops
      # AND PRAGMA query_only=1 catches any other write path) so a
      # long admin operation on the sidecar (canonicals backfill,
      # manual SQL) has the writer lock to itself. Unset / remove
      # the line and restart this service to restore read-write.
      # Largely subsumed by the broker (above): with broker mode on,
      # this container is already read-only at the SQLite layer.
      # READ_ONLY_DB: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The sidecar owns schema migration; gate web start on its
    # healthcheck so gunicorn doesn't serve requests against an
    # unmigrated DB on a fresh /data volume. Default `service_started`
    # would only wait for the sidecar's container to launch (faster but
    # racy). Switch to that if you migrate manually before bringing
    # the stack up. When broker mode is on (see env block above),
    # add `mimir-broker: condition: service_healthy` here so cache
    # writes have somewhere to land before gunicorn serves.
    depends_on:
      mimir-tasks:
        condition: service_healthy

  # Scheduled-tasks sidecar: warm-cache, update (sync + ingest),
  # update-mainline (linux.git + MAINTAINERS refresh), analyze, vacuum.
  # Replaces cron / systemd timers. Shares the same /data volume; no
  # port exposure. See deploy/scheduler.sh for the loop body and the
  # env-overridable cadence knobs (WARM_CACHE_EVERY, UPDATE_EVERY,
  # UPDATE_MAINLINE_EVERY, ANALYZE_EVERY, VACUUM_EVERY, all in seconds).
  #
  # Owns `alembic upgrade head` (single source of DDL truth). The
  # healthcheck reports healthy once the sentinel `/data/.migrated`
  # appears, which scheduler.sh touches after a successful migration.
  mimir-tasks:
    build: .
    image: mimir:latest
    command: ["/app/scheduler.sh"]
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      # Write-broker integration (opt-in, off by default). Uncomment
      # both lines AND the `mimir-broker` service block below when
      # adopting broker mode. The tasks role keeps RW connections
      # (direct writes from ingest, backfill, update-mainline still
      # work); only cache.set / delete / purge_expired calls from
      # inside these CLI commands route through the broker.
      # MIMIR_ROLE: "tasks"
      # BROKER_SOCKET_PATH: "/data/.broker.sock"
      # Match the web container's INBOXES / SITE_NAME / etc. so the
      # CLI commands see the same Settings.
      # SITE_NAME: lkml-mirror
      # INBOXES: '{"linux-fsdevel": {...}}'
      #
      # Default sidecar output is terse: warm-cache emits one summary
      # line per tick, update stays silent on no-op ticks. Uncomment
      # to dial the loop verbose; "-vv" adds per-message ingest detail.
      # For an ad-hoc verbose run without restarting:
      #   podman exec mimir-tasks flask --app mimir warm-cache -v
      # SCHEDULER_VERBOSE: "-v"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s

  # Write-broker sidecar. Owns the sole writer connection across
  # every periodic + admin write op as of 1.39.0 (Phase 2.4):
  # cache.{set,delete,delete_for_inbox,purge_expired}, ingest_inbox,
  # all four backfills, update_mainline, analyze, vacuum,
  # bootstrap_inboxes, the seven admin inbox CRUD ops, and
  # failures_replay. Complex writes ride the long worker; cache
  # writes ride the cache worker; warm jobs fan out across N warm
  # workers. See mimir/broker/ for the daemon + protocol + client.
  #
  # The broker also runs a post-migrate ANALYZE on first startup
  # (sentinel-gated at /data/.broker_initial_analyze); the web tier
  # gates on the broker's healthcheck so cold requests after a
  # deploy don't walk un-ANALYZE'd indexes.
  #
  # `mimir broker-ping` is the healthcheck command.
  #
  # OFF BY DEFAULT (broker mode opt-in until 2.0.0 makes it
  # mandatory). To enable: uncomment the whole block below, AND
  # uncomment the MIMIR_ROLE / BROKER_SOCKET_PATH env vars on the
  # `mimir` and `mimir-tasks` services above, AND add
  # `mimir-broker: condition: service_healthy` to the web service's
  # `depends_on:`. Three uncomments + one add.
  # mimir-broker:
  #   build: .
  #   image: mimir:latest
  #   command: ["mimir", "broker", "--socket", "/data/.broker.sock"]
  #   volumes:
  #     - ./data:/data
  #   environment:
  #     SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
  #     DATABASE_URL: sqlite:////data/db/mimir.db
  #     # Broker role: this is the sole writer. PRAGMA query_only stays
  #     # OFF on its connections. The broker process itself does NOT
  #     # set BROKER_SOCKET_PATH on its own env (no self-RPC).
  #     MIMIR_ROLE: "broker"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mimir", "broker-ping", "--socket", "/data/.broker.sock"]
  #     interval: 10s
  #     timeout: 2s
  #     retries: 3
  #     # Generous start_period: on a fresh deploy the broker runs
  #     # the post-migrate ANALYZE (bounded, ~1-3 s on prod) before
  #     # accepting RPCs, plus its own startup time. Subsequent
  #     # restarts skip the ANALYZE (sentinel-gated).
  #     start_period: 30s
  #   # Broker depends on the sidecar's `/data/.migrated` sentinel
  #   # so the cache + ingest schemas exist before the broker
  #   # accepts its first write. The scheduler still owns the
  #   # alembic step.
  #   depends_on:
  #     mimir-tasks:
  #       condition: service_healthy

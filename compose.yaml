# `docker compose up` brings mimir up with the canonical bind-mount
# layout. Adjust paths / env to taste.
#
# SECRET_KEY is read from your shell or a sibling `.env` file:
#   echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" > .env

services:
  mimir:
    build: .
    image: mimir:latest
    ports:
      - "5000:5000"
    volumes:
      # Single state volume. Layout (created at build time):
      #   ./data/db/       , SQLite DB + WAL files
      #   ./data/Inboxes/  , per-inbox public-inbox git mirrors
      # Pre-flight: `mkdir -p data/db data/Inboxes && chown -R 1001:1001 data`.
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      WORKERS: "2"
      # Wire up ProxyFix so request.remote_addr / .scheme / .host reflect
      # the real client through Caddy (or whatever reverse proxy fronts
      # the container). 1 = trust the last hop. Bump only if you stack
      # additional proxies in front of Caddy. Leave unset if you publish
      # port 5000 directly, anyone could otherwise spoof these values
      # via a forged X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "1"
      # Optional:
      # SITE_NAME: lkml-mirror
      # SECURITY_CONTACT: mailto:security@example.com
      # SECURITY_POLICY_URL: https://example.com/security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The sidecar owns schema migration; gate web start on its
    # healthcheck so gunicorn doesn't serve requests against an
    # unmigrated DB on a fresh /data volume. Default `service_started`
    # would only wait for the sidecar's container to launch (faster but
    # racy). Switch to that if you migrate manually before bringing
    # the stack up.
    depends_on:
      mimir-tasks:
        condition: service_healthy

  # Scheduled-tasks sidecar: warm-cache, update (sync + ingest),
  # update-mainline (linux.git + MAINTAINERS refresh), analyze, vacuum.
  # Replaces cron / systemd timers. Shares the same /data volume; no
  # port exposure. See deploy/scheduler.sh for the loop body and the
  # env-overridable cadence knobs (WARM_CACHE_EVERY, UPDATE_EVERY,
  # UPDATE_MAINLINE_EVERY, ANALYZE_EVERY, VACUUM_EVERY, all in seconds).
  #
  # Owns `alembic upgrade head` (single source of DDL truth). The
  # healthcheck reports healthy once the sentinel `/data/.migrated`
  # appears, which scheduler.sh touches after a successful migration.
  mimir-tasks:
    build: .
    image: mimir:latest
    command: ["/app/scheduler.sh"]
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: sqlite:////data/db/mimir.db
      # Match the web container's INBOXES / SITE_NAME / etc. so the
      # CLI commands see the same Settings.
      # SITE_NAME: lkml-mirror
      # INBOXES: '{"linux-fsdevel": {...}}'
      #
      # Default sidecar output is terse: warm-cache emits one summary
      # line per tick, update stays silent on no-op ticks. Uncomment
      # to dial the loop verbose; "-vv" adds per-message ingest detail.
      # For an ad-hoc verbose run without restarting:
      #   podman exec mimir-tasks flask --app mimir warm-cache -v
      # SCHEDULER_VERBOSE: "-v"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/data/.migrated"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 0s
